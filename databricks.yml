bundle:
  name: bakehouse-benoit
variables:
  llm_endpoint_name:
    default: databricks-gpt-oss-120b
  catalog_name:
    default: labuser_benoit
  lakebase_autoscaling_project:
    default: bakehouse-benoit
  function_1_name:
    default: top_artists
  function_2_name:
    default: most_played_tracks
  embedding_endpoint:
    default: databricks-gte-large-en
  embedding_dims:
    default: '1024'
resources:
  experiments:
    bakehouse_experiment:
      name: /Users/${workspace.current_user.userName}/bakehouse_app_experiment
  apps:
    datarocker-benoit:
      name: datarocker-benoit
      description: Spotify Listening Behavior Analyst with stateful memory
      source_code_path: .
      config:
        command:
        - python
        - server.py
        env:
        - name: SERVING_ENDPOINT_NAME
          value: ${var.llm_endpoint_name}
        - name: MLFLOW_EXPERIMENT_ID
          value: ${resources.experiments.bakehouse_experiment.id}
        - name: CATALOG_NAME
          value: ${var.catalog_name}
        - name: SCHEMA_NAME
          value: spotify
        - name: LAKEBASE_AUTOSCALING_PROJECT
          value: ${var.lakebase_autoscaling_project}
        - name: LAKEBASE_AUTOSCALING_BRANCH
          value: production
        - name: FUNCTION_1_NAME
          value: ${var.function_1_name}
        - name: FUNCTION_2_NAME
          value: ${var.function_2_name}
        - name: EMBEDDING_ENDPOINT
          value: ${var.embedding_endpoint}
        - name: EMBEDDING_DIMS
          value: ${var.embedding_dims}
      resources:
      - name: serving-endpoint
        serving_endpoint:
          name: ${var.llm_endpoint_name}
          permission: CAN_QUERY
      - name: experiment
        experiment:
          experiment_id: ${resources.experiments.bakehouse_experiment.id}
          permission: CAN_EDIT
      - name: uc-function-1
        uc_securable:
          securable_full_name: ${var.catalog_name}.spotify.${var.function_1_name}
          securable_type: FUNCTION
          permission: EXECUTE
      - name: uc-function-2
        uc_securable:
          securable_full_name: ${var.catalog_name}.spotify.${var.function_2_name}
          securable_type: FUNCTION
          permission: EXECUTE
      - name: database
        postgres:
          branch: projects/bakehouse-benoit/branches/production
          database: projects/bakehouse-benoit/branches/production/databases/databricks-postgres
          permission: CAN_CONNECT_AND_CREATE
targets:
  dev:
    default: true
